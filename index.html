  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    document.getElementById('start').onclick = async () => {
      
const sesion = sessionStorage.getItem('timeAttackSession');

if (!sesion) {
  document.getElementById('status').textContent =
    'Primero debes iniciar sesión con tu PIN de staff.';
  return;
}

      const status = document.getElementById('status');
      status.textContent = 'Abriendo cámara...';

      try {
        if (!window.Html5Qrcode) {
          throw new Error('No se cargó la biblioteca QR');
        }

        const scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 220 },
         decodedText => {
    try {
        const url = new URL(decodedText);
        const token = url.searchParams.get('t');

        if (!token) {
            status.textContent = 'El QR no contiene un token válido.';
            return;
        }

        
status.textContent = 'Consultando datos del piloto...';

scanner.stop().catch(console.error);

fetch(
  'https://time-attack-accesos-2027.juanjo-mosob.workers.dev/',
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      accion: 'lookup',
      session: sessionStorage.getItem('timeAttackSession'),
      token: token
    })
  }
)
.then(respuesta => respuesta.json())
.then(datos => {
  if (!datos.ok) {
    throw new Error(datos.error || 'No se encontró al piloto.');
  }

  const piloto = datos.resultado.piloto;

const ficha = document.getElementById('fichaPiloto');
const estadoPiloto = document.getElementById('estadoPiloto');
const estadoAuto = document.getElementById('estadoAuto');

ficha.style.display = 'block';

estadoPiloto.textContent =
  'Piloto: ' + (piloto.pilotoDentro ? 'DENTRO' : 'FUERA');

estadoAuto.textContent =
  'Automóvil: ' + (piloto.autoDentro ? 'DENTRO' : 'FUERA');

document.getElementById('btnEntradaPiloto').disabled =
  piloto.pilotoDentro;

document.getElementById('btnSalidaPiloto').disabled =
  !piloto.pilotoDentro;

document.getElementById('btnEntradaAuto').disabled =
  piloto.autoDentro;

document.getElementById('btnSalidaAuto').disabled =
  !piloto.autoDentro;

  status.textContent =
    'Piloto: ' + piloto.nombre +
    ' | Auto: ' + piloto.auto +
    ' | Categoría: ' + piloto.categoria +
    ' | PIT: ' + piloto.pit;
})
.catch(error => {
  status.textContent = 'Error: ' + error.message;
});


    } catch (error) {
        status.textContent = 'El QR no contiene un enlace válido.';
    }
},
          () => {}
        );

        status.textContent = 'Cámara activa. Lista para escanear.';
      } catch (error) {
        status.textContent =
          'Error: ' + (error.message || String(error));
      }
    };

<script>
  const WORKER_URL =
    'https://time-attack-accesos-2027.juanjo-mosob.workers.dev/';

  document.getElementById('loginButton').onclick = async () => {
    const boton = document.getElementById('loginButton');
    const campoPin = document.getElementById('staffPin');
    const estado = document.getElementById('loginStatus');
    const pin = campoPin.value.trim();

    if (!/^\d{4,12}$/.test(pin)) {
      estado.textContent = 'Introduce un PIN válido.';
      return;
    }

    boton.disabled = true;
    estado.textContent = 'Verificando PIN...';

    try {
      const respuesta = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          accion: 'login',
          pin: pin
        })
      });

      const datos = await respuesta.json();

      if (!datos.ok || !datos.session) {
        throw new Error(datos.error || 'No se pudo iniciar sesión.');
      }

      sessionStorage.setItem('timeAttackSession', datos.session);
      campoPin.value = '';
      document.getElementById('loginCard').style.display = 'none';

      estado.textContent = '';
      alert('Sesión iniciada correctamente.');

    } catch (error) {
      estado.textContent = error.message || 'Error de conexión.';
    } finally {
      boton.disabled = false;
    }
  };
  
if (sessionStorage.getItem('timeAttackSession')) {
  document.getElementById('loginCard').style.display = 'none';
}

</script>
